purpose: >
  Preserve A0 intent across ChatGPT/Jules/Hermes/Orca session death.
  Agents must read this ledger before turning infrastructure state into priority.

north_star:
  statement: >
    A'Space V3 is one system whose purpose is to make Life OS and Business OS
    continuously executable, observable and evolvable without A0 becoming the human router.
  hierarchy:
    A0: Amadeus
    S1: Rick's Verse
    managers:
      Doctor13: Kernel Core
      Doctor11: Life Core
      Doctor12: Buzz Core
    companions:
      Kernel: [Ryan, Yaz, Graham]
      Life: [Amy, Rory, River]
      Buzz: [Bill, Clara, Nardole]

priority_law:
  - Life OS and Business OS value delivery outrank technical maintenance.
  - Kernel work is justified when it directly unlocks, protects or scales Life/Business execution.
  - After the 9 base Jules Companion lanes, more than 80 percent of new Jules capacity is reserved for Life + Business unless a critical Kernel blocker directly unlocks them.
  - Do not create new ontology/topology merely because a tool or session exposes another abstraction.
  - Evidence authorizes promotion into shared canon; it does not erase alternative branches.
  - No hidden shared-filesystem assumption between Jules sessions.

