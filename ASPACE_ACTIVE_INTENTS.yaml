priority_law:
  - Life OS and Business OS value delivery outrank technical maintenance.
  - Kernel work is justified when it directly unlocks, protects or scales Life/Business execution.
  - The current executable Jules topology is 9 Companion lanes: 3 Kernel + 3 Life + 3 Business.
  - Do not raise capacity counters above 9 unless additional executable lanes are actually materialized.
  - If capacity beyond the 9 base lanes is materialized, more than 80 percent of the new capacity goes to Life + Business unless a critical Kernel blocker directly unlocks them.
  - Do not create new ontology/topology merely because a tool or session exposes another abstraction.
  - Evidence authorizes promotion into shared canon; it does not erase alternative branches.
  - No hidden shared-filesystem assumption between Jules sessions.

