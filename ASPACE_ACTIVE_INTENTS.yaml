deferred_but_preserved:
  - id: DEFERRED-V2
    intent: >
      Keep V2 and V3 accessible until provenance/useful canon/history are extracted;
      archive V2 only after classification and evidence, never by premature deletion.
  - id: DEFERRED-TAKEOUT
    intent: >
      Preserve/export ChatGPT and Gemini/Takeout material needed for continuity and distillation.
  - id: DEFERRED-OMARCHY
    intent: >
      Build Omarchy as the A'Space Living Desktop once Codespaces/Supabase continuity is stable;
      do not let VM setup become another Bedrock detour.

session_start_contract:
  required_reads:
    - ASPACE_ACTIVE_INTENTS.yaml
    - ASPACE_WORKSPACE_REGISTRY.json
  then_read:
    - Linear issue/project relevant to the requested lane
    - Supabase aspace WorkGraph state
    - GitHub PR/branch evidence
  forbidden_default:
    - reconstructing architecture from chat archaeology
    - turning technical defects into top priority without checking priority_law
    - creating duplicate Jules sessions or duplicate PR lines
    - assuming missing files in one checkout mean the world/artifact does not exist

definition_of_success:
  - A0 can leave a session without losing active intent.
  - Life and Business milestones move because work is reviewed/promoted, not because more infrastructure is invented.
  - Rick and Doctors can recover current execution from Linear + Supabase + GitHub + Registry.
  - Omarchy/Codespaces become habitats/workspaces, not new competing sources of truth.
