session_start_contract:
  required_reads:
    - ASPACE_ACTIVE_INTENTS.yaml
    - ASPACE_WORKSPACE_REGISTRY.json
  then_read:
    - Linear issue/project relevant to the requested lane
    - Supabase aspace WorkGraph/IPBD state
    - GitHub PR/branch evidence
    - Gemini Takeout corpus when original intent, chronology or historical Kernel evolution is material
  forbidden_default:
    - reconstructing architecture from chat archaeology alone
    - treating the Gemini Takeout as disposable archive
    - treating the Gemini Takeout as live operational truth without reconciliation
    - turning technical defects into top priority without checking priority_law
    - creating duplicate Jules sessions or duplicate PR lines
    - assuming missing files in one checkout mean the world/artifact does not exist

definition_of_success:
  - A0 can leave a session without losing active intent.
  - Life and Business milestones move because work is reviewed/promoted, not because more infrastructure is invented.
  - Rick and Doctors recover current execution from Linear + Supabase + GitHub + Registry.
  - Historical intent can be recovered from Gemini/ChatGPT exports without letting historical state override current evidence.
  - Omarchy/Codespaces become habitats/workspaces, not competing sources of truth.


