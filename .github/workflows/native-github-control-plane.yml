name: A'Space Native GitHub Control Plane

on:
  push:
    branches:
      - main
    paths:
      - "docs/governance/ASPACE_GATEWAY_NATIVE_GITHUB_V0.md"
      - "docs/wiki/**"
      - "scripts/github_native_bootstrap.py"
      - ".github/workflows/native-github-control-plane.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  discussions: write

jobs:
  bootstrap-native-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bootstrap Milestone, Discussion, Projects and Wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASPACE_PROJECTS_TOKEN: ${{ secrets.ASPACE_PROJECTS_TOKEN }}
        run: python scripts/github_native_bootstrap.py
