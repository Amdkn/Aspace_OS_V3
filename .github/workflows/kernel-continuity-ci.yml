name: Kernel Continuity CI

on:
  pull_request:
    paths:
      - "10_Tech_OS/kernel/**"
      - "80_Agent-OS/capability_fabric/**"
      - ".github/workflows/kernel-continuity-ci.yml"
  push:
    branches: [main]
    paths:
      - "10_Tech_OS/kernel/**"
      - "80_Agent-OS/capability_fabric/**"
      - ".github/workflows/kernel-continuity-ci.yml"

jobs:
  verify-kernel-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            10_Tech_OS/kernel
            80_Agent-OS/capability_fabric
            30_Business_OS/20_Workflow_Engine
            ASPACE_WORKSPACE_REGISTRY.json
            .github/workflows/kernel-continuity-ci.yml
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install inter-fabric test dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile continuity modules
        run: |
          python -m py_compile \
            10_Tech_OS/kernel/mission_continuity.py \
            10_Tech_OS/kernel/runtime_presence.py \
            10_Tech_OS/kernel/dispatch_routing.py \
            10_Tech_OS/kernel/mission_watcher.py \
            10_Tech_OS/kernel/uc_workgraph.py \
            10_Tech_OS/kernel/test_mission_continuity.py \
            10_Tech_OS/kernel/test_runtime_presence.py \
            10_Tech_OS/kernel/test_dispatch_routing.py \
            10_Tech_OS/kernel/test_mission_watcher.py \
            10_Tech_OS/kernel/inter_fabric.py \
            10_Tech_OS/kernel/test_inter_fabric.py \
            10_Tech_OS/kernel/test_inter_fabric_runtime_canary.py \
            10_Tech_OS/kernel/test_embodied_holon_migration.py \
            10_Tech_OS/kernel/anti_amnesia.py \
            10_Tech_OS/kernel/test_anti_amnesia.py \
            10_Tech_OS/kernel/test_anti_amnesia_temporal.py \
            10_Tech_OS/kernel/temporal_truth/packets.py \
            10_Tech_OS/kernel/temporal_truth/test_packets.py \
            10_Tech_OS/kernel/temporal_truth/temporal_truth.py \
            10_Tech_OS/kernel/temporal_truth/compiler.py \
            10_Tech_OS/kernel/temporal_truth/test_temporal_truth.py \
            10_Tech_OS/kernel/temporal_truth/test_canary.py \
            10_Tech_OS/kernel/temporal_truth/reconciliation.py \
            10_Tech_OS/kernel/temporal_truth/test_reconciliation.py \
            10_Tech_OS/kernel/temporal_truth/test_context_compiler.py \
            80_Agent-OS/capability_fabric/temporal_adapters.py \
            80_Agent-OS/capability_fabric/test_temporal_adapters.py
      - name: Mission continuity + presence + dispatch + watcher regression suite
        working-directory: 10_Tech_OS/kernel
        run: python -m unittest test_mission_continuity.py test_runtime_presence.py test_dispatch_routing.py test_mission_watcher.py test_inter_fabric.py test_inter_fabric_runtime_canary.py
      - name: Temporal handoff packet suite
        working-directory: 10_Tech_OS/kernel/temporal_truth
        run: python -m unittest test_packets.py
      - name: Temporal Truth G0-G2 canaries
        working-directory: 10_Tech_OS/kernel/temporal_truth
        run: python -m unittest test_temporal_truth.py test_canary.py
      - name: Temporal Truth G3 Rory reconciliation
        working-directory: 10_Tech_OS/kernel/temporal_truth
        run: python -m unittest test_reconciliation.py
      - name: Temporal Truth G4 Context Compiler
        working-directory: 10_Tech_OS/kernel/temporal_truth
        run: python -m unittest test_context_compiler.py
      - name: Temporal Truth G5 Embodied Holon migration
        working-directory: 10_Tech_OS/kernel
        run: python -m unittest test_embodied_holon_migration.py
      - name: Temporal Truth G6 Agent OS capability exposure
        run: python 80_Agent-OS/capability_fabric/test_temporal_adapters.py
      - name: Temporal Truth G7 Anti-Amnesia integration
        working-directory: 10_Tech_OS/kernel
        run: python -m unittest test_anti_amnesia.py test_anti_amnesia_temporal.py
